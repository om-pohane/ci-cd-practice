spring.application.name=Practice-2

# ---------- Database (MySQL) ----------

   spring.datasource.url=jdbc:mysql://localhost:3306/student_db
   spring.datasource.username=root
   spring.datasource.password=root


# ---------- JPA / Hibernate ----------
# "update" creates the students table automatically from the Student class
spring.jpa.hibernate.ddl-auto=update
# Print the SQL queries in the console
spring.jpa.show-sql=true


# Show our error message (e.g. "Student not found with id 5") in error responses
spring.web.error.include-message=always
